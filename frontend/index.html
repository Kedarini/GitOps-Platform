<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GitOps + uv Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #0f172a; color: #f8fafc; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button { background: #38bdf8; border: none; padding: 10px 20px; color: #0f172a; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0ea5e9; }
    </style>
</head>
<body>
    <div class="card">
        <h1>DevOps Portfolio (uv + K8s)</h1>
        <p>Backend Status: <span id="status">Checking...</span></p>
        <p>Served by Pod: <span id="host">-</span></p>
        <p>Visit Count: <span id="visits">-</span></p>
        <button onclick="fetchData()">Refresh Data</button>
    </div>

    <script>
        async function fetchData() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                document.getElementById('status').innerText = "OK";
                document.getElementById('host').innerText = data.hostname;
                document.getElementById('visits').innerText = data.visits;
            } catch (err) {
                document.getElementById('status').innerText = "Connection Error";
            }
        }
        fetchData();
    </script>
</body>
</html>
